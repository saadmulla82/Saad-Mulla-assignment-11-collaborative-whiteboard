<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real-Time Collaborative Whiteboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div id="app-header">
    <h1>🎨 Board Studio</h1>
    <span id="room-badge" class="badge">Room: DESIGN_101</span>
    <span id="users-count" class="badge">1 Online</span>
  </div>

  <div id="toolbar">
    <div class="tool-group">
      <button id="btn-pencil" class="active">Pencil</button>
      <button id="btn-eraser">Eraser</button>
    </div>

    <div class="tool-group">
      <label for="color-picker">Color</label>
      <input type="color" id="color-picker" value="#2563eb">
    </div>

    <div class="tool-group">
      <label for="size-picker">Size</label>
      <input type="range" id="size-picker" min="1" max="30" value="4">
    </div>

    <div class="tool-group">
      <button id="btn-undo">↩ Undo</button>
      <button id="btn-clear" class="danger">🗑 Clear</button>
    </div>
  </div>

  <div id="canvas-container">
    <canvas id="whiteboard"></canvas>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="canvas.js"></script>
</body>
</html>
